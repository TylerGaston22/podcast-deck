# Builds PodcastDeck-Setup.exe on Windows and publishes it as a GitHub Release, whenever the deck's code
# changes on main (or by hand from the Actions tab). The installed app checks the latest release each
# time it opens and updates itself. Download link for people:
#   https://github.com/TylerGaston22/podcast-deck/releases/latest/download/PodcastDeck-Setup.exe
name: Release

on:
  push:
    branches: [main]
    paths:
      - "*.py"
      - "*.html"
      - "NOTES.md"
      - "requirements.txt"
      - "installer/**"
      - ".github/workflows/release.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Version number
        id: version
        shell: bash
        run: |
          echo "number=1.0.${{ github.run_number }}" >> "$GITHUB_OUTPUT"
          echo 'VERSION = "1.0.${{ github.run_number }}"' > version.py

      - name: Add-ons
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller

      - name: Build the app
        run: |
          python -m PyInstaller --noconfirm --onedir --noconsole --name PodcastDeck --hidden-import build_scenes deck.py
          foreach ($f in @("config.example.py", "NOTES.md", "player.html", "bg_player.html", "bg_frame.html", "bg_control.html")) {
            Copy-Item $f dist\PodcastDeck\
          }

      - name: Quick check
        run: |
          if (-not (Test-Path dist\PodcastDeck\PodcastDeck.exe)) { throw "PodcastDeck.exe wasn't built" }
          python -c "import ast, sys; [ast.parse(open(f, encoding='utf-8').read()) for f in sys.argv[1:]]" (Get-ChildItem *.py).Name

      - name: Build the installer
        run: |
          if (-not (Get-Command iscc -ErrorAction SilentlyContinue)) {
            if (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe") {
              $env:PATH += ";${env:ProgramFiles(x86)}\Inno Setup 6"
            } else {
              choco install innosetup -y --no-progress
              $env:PATH += ";${env:ProgramFiles(x86)}\Inno Setup 6"
            }
          }
          iscc /DVersion=${{ steps.version.outputs.number }} installer\PodcastDeck.iss

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${{ steps.version.outputs.number }}" dist\PodcastDeck-Setup.exe `
            --title "Podcast Deck ${{ steps.version.outputs.number }}" `
            --notes "Built from ${{ github.sha }}. Download PodcastDeck-Setup.exe and open it. Installed decks update themselves." `
            --target ${{ github.sha }}
