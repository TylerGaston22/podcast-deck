<!doctype html>
<!-- The page OBS's "Video Panel" source shows: the Video + Cams video. It's a local file, so it always
     loads, even before the deck is open. When the admin's deck says there's a video, it shows the deck's
     player page (bg_frame.html?ch=video, from localhost), which follows the browser control page opened
     by Play link…: play, pause, mute, volume, seek, and stop. With no video (or no deck), it shows the
     empty-box card set in Settings → Backgrounds: a picture, or a line of text. -->
<html>
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: transparent; }
  iframe, #idle { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
  #idle { display: flex; align-items: center; justify-content: center; box-sizing: border-box;
          background: rgba(10, 13, 22, 0.88); border: 0.4vw solid #3da9ff; border-radius: 1.6vw;
          color: #f4f7fc; font: 700 6vw/1.2 "Segoe UI", sans-serif; text-align: center; padding: 4vw; }
  #idle.picture { background: transparent; border: 0; padding: 0; }
  #idle img { width: 100%; height: 100%; object-fit: cover; border-radius: 1.6vw; }
  #idle.empty { display: none; }
</style>
</head>
<body>
<div id="idle">Video coming up</div>
<script>
  const DECK = "http://127.0.0.1:4461", PLAYER = "http://localhost:4461";
  const idle = document.getElementById("idle");
  let frame = null, misses = 0, shownIdle = null;

  function showIdle(card) {
    const key = JSON.stringify(card);
    if (key === shownIdle) return;
    shownIdle = key;
    idle.className = "";
    if (card.picture) {
      idle.className = "picture";
      idle.innerHTML = "";
      const img = document.createElement("img");
      img.src = PLAYER + "/bg/picture/" + encodeURIComponent(card.picture);
      idle.appendChild(img);
    } else if (card.text) {
      idle.textContent = card.text;
    } else {
      idle.className = "empty";
    }
  }

  async function poll() {
    try {
      const s = await (await fetch(DECK + "/video/state", { cache: "no-store" })).json();
      misses = 0;
      if (s && !frame) {
        frame = document.createElement("iframe");
        frame.allow = "autoplay; encrypted-media";
        frame.src = PLAYER + "/bg/frame?ch=video";
        document.body.appendChild(frame);
      } else if (!s && frame) {
        frame.remove();
        frame = null;
      }
      if (!s) {
        const card = await (await fetch(DECK + "/video/idle", { cache: "no-store" })).json();
        if (card) showIdle(card);
      }
    } catch (e) {
      // The deck is closed: after a few seconds without it, take the video away.
      if (++misses >= 3 && frame) {
        frame.remove();
        frame = null;
      }
    }
    idle.style.visibility = frame ? "hidden" : "visible";
  }
  poll();
  setInterval(poll, 1000);
</script>
</body>
</html>
