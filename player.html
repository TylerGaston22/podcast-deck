<!doctype html>
<!-- The page OBS's "Video Panel" source shows. The deck writes the video to play into
     now_playing.js next to this file and refreshes the source. YouTube refuses embed links
     opened on their own (Error 153), so the video has to be wrapped in a page like this. -->
<html>
<head>
<meta charset="utf-8">
<meta name="referrer" content="strict-origin-when-cross-origin">
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: transparent; }
  body.playing { background: #000; }
  #player { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
  #msg { display: none; position: absolute; inset: 0; padding: 40px; align-items: center;
         justify-content: center; text-align: center; color: #e6ebf1; background: #0c0f14;
         font: 600 32px/1.4 "Segoe UI", sans-serif; }
</style>
</head>
<body>
<div id="player"></div>
<div id="msg"></div>
<script>window.NOW_PLAYING = null;</script>
<script src="now_playing.js"></script>
<script>
  const now = window.NOW_PLAYING;

  function show(text) {
    const m = document.getElementById("msg");
    m.textContent = text;
    m.style.display = "flex";
  }

  window.onYouTubeIframeAPIReady = function () {
    new YT.Player("player", {
      videoId: now.id,
      playerVars: { autoplay: 1, start: now.start || 0, rel: 0, playsinline: 1 },
      events: {
        onReady: (e) => e.target.playVideo(),
        // 101 and 150: the owner turned off embedding. 2 and 100: bad link, private, or deleted.
        onError: (e) => show(e.data === 101 || e.data === 150
          ? "This video can't be played here. Its owner only allows it on YouTube."
          : "YouTube couldn't play this video. It may be private or deleted."),
      },
    });
  };

  if (now && now.id) {
    document.body.classList.add("playing");
    const s = document.createElement("script");
    s.src = "https://www.youtube.com/iframe_api";
    document.head.appendChild(s);
  }
</script>
</body>
</html>
